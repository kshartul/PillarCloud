apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: openstack-portal
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: openstack_portal
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  AUTH_SERVICE_URL: http://auth-service:3001
  ADMIN_SERVICE_URL: http://admin-service:8001
  CLOUD_SERVICE_URL: http://cloud-service:8002
  BILLING_SERVICE_URL: http://billing-service:3002
  NOTIFICATION_SERVICE_URL: http://notification-service:3003
  OS_AUTH_URL: http://keystone:5000/v3
  OS_REGION_NAME: RegionOne
  OS_INTERFACE: public
  OS_IDENTITY_API_VERSION: "3"
  LOG_LEVEL: info
  NODE_ENV: production
