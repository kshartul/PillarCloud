# All application microservice Deployments + Services

# ─── API Gateway ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: openstack-portal
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
      - name: api-gateway
        image: openstack-portal/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 3000 }]
        envFrom:
        - configMapRef: { name: portal-config }
        - secretRef:    { name: portal-secrets }
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: openstack-portal
spec:
  selector: { app: api-gateway }
  ports: [{ port: 3000, targetPort: 3000 }]
---
